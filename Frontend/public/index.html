<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Obsidian - Premium Shopping"
    />
    <title>Obsidian - Premium Shopping</title>

    <meta property="og:title" content="Obsidian - Premium Shopping" />
    <meta
      property="og:description"
      content="A modern full-stack e-commerce experience built with React, Node.js, and Google OAuth."
    />
    <meta property="og:url" content="https://obsidian-ecommerce.vercel.app/" />
    <meta property="og:type" content="website" />

    <script>
      (function() {
        if (window.location.search) {
          var s = window.location.search;
          if (s.indexOf("trackingId") !== -1 || s.indexOf("midToken") !== -1 || s.indexOf("trk") !== -1 || s.indexOf("li_") !== -1) {
            var cleanUrl = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);
          }
        }
      })();
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
