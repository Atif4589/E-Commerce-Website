<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Obsidian - Premium E-Commerce"
    />
    <title>Obsidian - Premium Shopping</title>

    <!-- Strip LinkedIn tracking tokens immediately to prevent 404 reload loops -->
    <script>
      (function() {
        if (window.location.search) {
          const params = new URLSearchParams(window.location.search);
          if (params.has('trackingId') || params.has('midToken') || params.has('trk') || window.location.search.includes('li_')) {
            const cleanUrl = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);
          }
        }
      })();
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
